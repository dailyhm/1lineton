services:
  - type: web
    name: deveil-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEVEIL_MODEL
        value: gemini-3.8-flash
      - key: DEVEIL_CORS_ORIGINS
        value: "*"
      - key: DEVEIL_TEMPERATURE
        value: "0.2"
      - key: DEVEIL_QUESTION_MAX_OUTPUT_TOKENS
        value: "1800"
      - key: DEVEIL_COMPARISON_MAX_OUTPUT_TOKENS
        value: "2500"
      - key: DEVEIL_LEARNING_MAX_OUTPUT_TOKENS
        value: "1500"
      - key: DEVEIL_AI_MAX_RETRIES
        value: "3"
      - key: DEVEIL_SESSION_TTL_SECONDS
        value: "1800"
